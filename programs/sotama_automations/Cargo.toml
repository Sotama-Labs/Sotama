[package]
name = "sotama_automations"
version = "0.1.0"
description = "Sotama on-chain automation program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sotama_automations"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token"] }
# Native stake program CPIs (DelegateStake, Withdraw). Anchor 0.32 dropped
# the umbrella `solana-program` dep in favor of modular crates, so we pull
# `solana-stake-interface` ourselves for the stake instruction builders.
solana-stake-interface = "1.2"
