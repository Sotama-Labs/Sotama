<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- 
        SOTAMA - FINAL BRAND MARK
        Pure 2026 mathematical vector. 
        100% rotationally symmetric around coordinates (400, 300).
    -->
    
    <!-- Base Canvas (Carbon Void) - Remove this line if you want a transparent background for your website -->
    <rect width="100%" height="100%" fill="#0D0E10" />

    <!-- 
        ==================== ARCHITECTURAL REGISTRATION MARKS ==================== 
        Perfectly balanced on a 400x400 pixel bounding square around the center.
    -->
    <g stroke="#2A2D35" stroke-width="1.5" stroke-linecap="round" fill="none">
        <!-- Top Left: Center (200, 100) -->
        <path d="M 190 100 H 210 M 200 90 V 110" />
        
        <!-- Top Right: Center (600, 100) -->
        <path d="M 590 100 H 610 M 600 90 V 110" />
        
        <!-- Bottom Left: Center (200, 500) -->
        <path d="M 190 500 H 210 M 200 490 V 510" />
        
        <!-- Bottom Right: Center (600, 500) -->
        <path d="M 590 500 H 610 M 600 490 V 510" />
    </g>

    <!-- 
        ==================== THE MONOLITH PILLARS ==================== 
        Constructed from Aerospace Titanium (#C9CED6).
    -->
    <!-- LEFT PILLAR -->
    <path d="M 300 150 L 380 150 L 380 300 L 300 380 Z" fill="#C9CED6" />
    <path d="M 300 420 L 380 340 L 380 450 L 300 450 Z" fill="#C9CED6" />

    <!-- RIGHT PILLAR -->
    <path d="M 420 150 L 500 150 L 500 180 L 420 260 Z" fill="#C9CED6" />
    <path d="M 420 300 L 500 220 L 500 450 L 420 450 Z" fill="#C9CED6" />

    <!-- 
        ==================== THE EXECUTION BLADE ==================== 
        Constructed from Anodized Copper (#D85C30).
    -->
    <path d="M 260 446 L 260 434 L 540 154 L 540 166 Z" fill="#D85C30" />

</svg>
