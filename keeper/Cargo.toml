[workspace]

[package]
name = "sotama-keeper"
version = "0.1.0"
edition = "2021"
description = "Sotama keeper bot — watches Helius for trigger transactions and executes on-chain automations."

[[bin]]
name = "sotama-keeper"
path = "src/main.rs"

[dependencies]
solana-sdk = "2.2"
solana-client = "2.2"
solana-account-decoder = "2.2"
solana-transaction-status = "2.2"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

dotenvy = "0.15"
anyhow = "1"
thiserror = "1"

bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
url = "2"
bincode = "1"

# Signing abstraction (`src/signer.rs`).
async-trait = "0.1"
hex = "0.4"
# P-256 ECDSA stamper for Turnkey API auth (TurnkeySigner). Local-keypair
# code paths don't pull this at runtime, but it's small enough to always
# compile in.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
http = "1.4.0"
pyth-lazer-protocol = "0.41.0"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
