app = "sotama-stat-arb-bot"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  API_PORT = "8080"

# One machine, no autoscale, no autostop. Bot must stay live to stream
# Pyth Lazer ticks and poll Jupiter on schedule.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "immediate"

# Public HTTPS for the read API. Free shared IPv4/IPv6; no dedicated
# IP cost. Fly auto-issues a cert for <app>.fly.dev.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
