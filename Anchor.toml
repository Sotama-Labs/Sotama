[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sotama_automations = "5U9GqtAmk2pKXMPfBYVVAhQ7AmNUEztW1bfZaEJarK5g"

[programs.devnet]
sotama_automations = "5U9GqtAmk2pKXMPfBYVVAhQ7AmNUEztW1bfZaEJarK5g"

# Mainnet program ID is generated in Phase 4 (mainnet deploy). Until that
# keypair exists, leave commented to avoid accidental deploys against
# the wrong cluster. After `solana-keygen new -o keys/mainnet-program.json`,
# uncomment and paste the resulting pubkey.
# [programs.mainnet]
# sotama_automations = "<paste fresh mainnet pubkey here>"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.test.json -t 1000000 tests/**/*.ts"
